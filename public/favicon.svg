    <!-- Rodas -->
    <circle cx="10" cy="30" r="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="10" cy="30" r="1.5" fill="#38bdf8"/>
    <circle cx="30" cy="30" r="1.5" fill="#38bdf8"/>
  </g>
  <!-- Faixa de estrada estilizada -->
  <path d="M8 52 L20 48 L32 50 L44 46 L56 48" stroke="url(#road)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Pontilhado da estrada -->
  <line x1="14" y1="50" x2="18" y2="49" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="26" y1="49.5" x2="30" y2="49" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="38" y1="47.5" x2="42" y2="47" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="48" y1="47.5" x2="52" y2="47.5" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
</svg>
